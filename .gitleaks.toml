# gitleaks konfigurácia — default pravidlá + allowlist na známe false-positives
title = "moonid gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Ignoruj lockfile integrity hashe, placeholder env súbory a jeden historický syntetický testovací reťazec"
paths = [
  '''package-lock\.json''',
  '''.*\.example$''',
  '''.*\.example\.[^/]*$''',
]
regexes = [
  # Nejde o credential: bol vytvorený ako deterministické abc... testovacie heslo v commite 32e3818.
  '''abcdefghijklmnopqrstuvwxyz0123456789_-''',
]
