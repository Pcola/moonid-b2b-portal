name: keep-alive

# Bráni 7-dňovému auto-pauseu Supabase Free. Pinguje /api/health (robí SELECT 1
# do Postgresu), takže drží DB "živú". Á 6 h = obrovská rezerva voči 7-dňovému
# limitu a minimum GitHub Actions minút (4 behy/deň ≈ 120 min/mes — bezpečné aj
# na private repo, kde je free limit 2000 min/mes).
#
# Toto NIE je jemný uptime/latency monitor — na to použi externý UptimeRobot/
# BetterStack (5-min interval, nemíňa GitHub minúty). GitHub navyše občas oneskorí
# cron pod záťažou, čo pre prevenciu pauseu nevadí, ale pre monitoring áno.

on:
  schedule:
    - cron: "0 */6 * * *" # á 6 h (00/06/12/18 UTC) — << 7-dňový limit
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          url="https://moonid-b2b-portal.vercel.app/api/health"
          out=$(curl -sS -m 30 -w '\n%{http_code} %{time_total}s' "$url")
          body=$(printf '%s' "$out" | head -n1)
          meta=$(printf '%s' "$out" | tail -n1)
          code=${meta%% *}
          echo "health=$body  (HTTP $meta)"
          test "$code" = "200" || { echo "::error::health check failed (HTTP $code)"; exit 1; }
          echo "$body" | grep -q '"db":"up"' || { echo "::error::DB not up"; exit 1; }
