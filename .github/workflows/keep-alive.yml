name: keep-alive

# Bráni 7-dňovému auto-pauseu Supabase Free. Pinguje /api/health (robí SELECT 1
# do Postgresu), takže drží DB "živú". Á 6 h = obrovská rezerva voči 7-dňovému
# limitu a minimum GitHub Actions minút (4 behy/deň ≈ 120 min/mes — bezpečné aj
# na private repo, kde je free limit 2000 min/mes).
#
# Toto NIE je jemný uptime/latency monitor — na to použi externý UptimeRobot/
# BetterStack (5-min interval, nemíňa GitHub minúty). GitHub navyše občas oneskorí
# cron pod záťažou, čo pre prevenciu pauseu nevadí, ale pre monitoring áno.

on:
  schedule:
    - cron: "0 */6 * * *" # á 6 h (00/06/12/18 UTC) — << 7-dňový limit
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          # Voliteľné. Ak má projekt zapnutý Vercel Firewall / Attack Challenge
          # alebo Deployment Protection, surový curl dostane "Security Checkpoint"
          # (nie JSON) a ping zlyhá. Vtedy nastav GitHub secret
          # VERCEL_PROTECTION_BYPASS (+ povoľ bypass vo Verceli). Prázdny = ide bez neho.
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          url="https://moonid-b2b-portal.vercel.app/api/health"
          ua="moonid-keepalive (+https://github.com/Pcola/moonid-b2b-portal)"
          for attempt in 1 2 3; do
            out=$(curl -sS -m 30 -A "$ua" \
              ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
              -w '\n%{http_code}' "$url") || true
            code=$(printf '%s' "$out" | tail -n1)
            body=$(printf '%s' "$out" | head -n1)
            echo "attempt $attempt: HTTP $code -> $body"
            if { [ "$code" = "200" ] || [ "$code" = "503" ]; } && printf '%s' "$body" | grep -q '"db":"up"'; then
              if [ "$code" = "503" ]; then
                echo "::warning::DB odpovedala, ale aplikačné dependencies sú degraded; rieši ich samostatný readiness alert."
              fi
              echo "OK — DB živá"; exit 0
            fi
            sleep 10
          done
          echo "::error::keep-alive zlyhal (HTTP/JSON nesedí — výpadok alebo bot-challenge). Skontroluj Vercel Firewall alebo nastav VERCEL_PROTECTION_BYPASS."
          exit 1
