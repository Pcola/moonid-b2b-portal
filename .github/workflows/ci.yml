name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# least-privilege: CI nič nezapisuje do repa (len číta) — default token by mal read/write
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # efemérna Postgres DB pre tenant-izolačné testy (žiadne reálne dáta)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moonid_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/moonid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci = deterministický install zo zamknutého lock file; postinstall spustí prisma generate
      - run: npm ci
      # aplikuj schému na efemérnu DB
      - run: npx prisma migrate deploy
      # typová kontrola — musí prejsť
      - run: npx tsc --noEmit
      # ESLint — errors blokujú build (warnings nie)
      - run: npm run lint
      # produkčný build — zachytí RSC/route/statické chyby, ktoré tsc --noEmit nevidí.
      # Placeholder NEXT_PUBLIC_* stačia (build nič nevolá na živý Supabase); DB je efemérna vyššie.
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
      # tenant-izolačné testy (firma A → dáta firmy B = 404)
      - run: npm test
      # bezpečnosť závislostí — build padne pri high/critical zraniteľnosti
      - run: npm audit --audit-level=high
