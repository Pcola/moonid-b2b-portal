name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing isolated database credentials
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: Bootstrap creates staging schema/grants; migrate verifies runtime; sync rotates the staging runtime credential
        required: true
        default: migrate
        type: choice
        options:
          - migrate
          - bootstrap
          - sync-runtime-credential
      confirmation:
        description: Type the selected environment name to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: database-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate requested operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "$TARGET_ENVIRONMENT" ]]; then
            echo "Confirmation must exactly match the selected environment."
            exit 1
          fi
          if [[ "$OPERATION" == "bootstrap" && "$TARGET_ENVIRONMENT" != "staging" ]]; then
            echo "Bootstrap is intentionally restricted to staging."
            exit 1
          fi
          if [[ "$OPERATION" == "sync-runtime-credential" && "$TARGET_ENVIRONMENT" != "staging" ]]; then
            echo "Runtime credential sync is intentionally restricted to staging."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        env:
          # `npm ci` spúšťa `prisma generate`; syntakticky platný lokálny placeholder
          # zabráni tomu, aby install skripty dostali produkčné/stagingové secrets.
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
        run: npm ci

      - name: Validate migrator database credential
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MIGRATOR_DATABASE_URL:-}" ]]; then
            echo "MIGRATOR_DATABASE_URL is required."
            exit 1
          fi

      - name: Validate isolated runtime database credential
        if: inputs.operation == 'migrate' || inputs.operation == 'sync-runtime-credential'
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNTIME_DATABASE_URL:-}" ]]; then
            echo "RUNTIME_DATABASE_URL is required for migrate and credential sync."
            exit 1
          fi
          if [[ "$MIGRATOR_DATABASE_URL" == "$RUNTIME_DATABASE_URL" ]]; then
            echo "Migrator and runtime credentials must be different."
            exit 1
          fi

      # Migrácie berú ACCESS EXCLUSIVE na "User" (identity triggery v 20260824170000). Bez
      # lock_timeout by `migrate deploy` čakal v zámkovej fronte neobmedzene a každý ďalší
      # dotaz na "User" by sa zaradil za neho — teda výpadok prihlásenia na celý čas čakania.
      # Bounded URL sa vytvára znova iba v krokoch, ktoré databázu skutočne používajú; secret
      # preto nie je dostupný checkout/setup/install krokom ani uložený job-wide v GITHUB_ENV.
      - name: Preflight active internal admin invariant
        if: inputs.operation == 'migrate' || inputs.operation == 'bootstrap'
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          [[ "$MIGRATOR_DATABASE_URL" == *'?'* ]] && sep='&'
          export DATABASE_URL="${MIGRATOR_DATABASE_URL}${sep}options=-c%20lock_timeout%3D5000"
          export DIRECT_URL="$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          if [[ "$OPERATION" == "migrate" ]]; then
            npm run security:admin-invariant
            exit 0
          fi

          # A clean staging bootstrap has no User table (and a retry can have an empty
          # table), so it cannot satisfy the admin invariant yet. Once identity rows
          # exist, however, bootstrap must not be usable to bypass the same preflight.
          npx prisma db execute --stdin --schema prisma/schema.prisma <<'SQL'
          DO $bootstrap_preflight$
          DECLARE
            populated_without_admin boolean := false;
          BEGIN
            -- Dynamic SQL is intentional: a pristine database has no User relation,
            -- so PostgreSQL must not resolve that relation until after to_regclass.
            IF pg_catalog.to_regclass('public."User"') IS NOT NULL THEN
              EXECUTE $query$
                SELECT EXISTS (SELECT 1 FROM public."User")
                  AND NOT EXISTS (
                    SELECT 1
                      FROM public."User"
                     WHERE "role"::text = 'ADMIN'
                       AND "active" = true
                       AND "companyId" IS NULL
                  )
              $query$ INTO populated_without_admin;
            END IF;

            IF populated_without_admin THEN
              RAISE EXCEPTION 'Bootstrap blocked: populated User table requires an active internal ADMIN';
            END IF;
          END;
          $bootstrap_preflight$;
          SQL

      - name: Apply Prisma migrations with migrator credential
        if: inputs.operation != 'sync-runtime-credential'
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          [[ "$MIGRATOR_DATABASE_URL" == *'?'* ]] && sep='&'
          export DATABASE_URL="${MIGRATOR_DATABASE_URL}${sep}options=-c%20lock_timeout%3D5000"
          export DIRECT_URL="$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          npx prisma migrate deploy

      - name: Apply least-privilege runtime grants
        if: inputs.operation != 'sync-runtime-credential'
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          [[ "$MIGRATOR_DATABASE_URL" == *'?'* ]] && sep='&'
          export DATABASE_URL="${MIGRATOR_DATABASE_URL}${sep}options=-c%20lock_timeout%3D5000"
          export DIRECT_URL="$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          npx prisma db execute --file database/runtime-role.sql --schema prisma/schema.prisma

      - name: Verify migration state
        if: inputs.operation != 'sync-runtime-credential'
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          [[ "$MIGRATOR_DATABASE_URL" == *'?'* ]] && sep='&'
          export DATABASE_URL="${MIGRATOR_DATABASE_URL}${sep}options=-c%20lock_timeout%3D5000"
          export DIRECT_URL="$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          npx prisma migrate status

      - name: Verify active internal admin invariant
        if: inputs.operation == 'migrate' || inputs.operation == 'bootstrap'
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          [[ "$MIGRATOR_DATABASE_URL" == *'?'* ]] && sep='&'
          export DATABASE_URL="${MIGRATOR_DATABASE_URL}${sep}options=-c%20lock_timeout%3D5000"
          export DIRECT_URL="$DATABASE_URL"
          echo "::add-mask::$DATABASE_URL"
          if [[ "$OPERATION" == "bootstrap" ]]; then
            # A pristine bootstrap intentionally has no users yet. A retry over any
            # populated User table must preserve the same ADMIN invariant as migrate.
            npm run security:admin-invariant -- --allow-empty
          else
            npm run security:admin-invariant
          fi

      - name: Synchronize staging runtime credential
        if: inputs.operation == 'sync-runtime-credential'
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          [[ "$MIGRATOR_DATABASE_URL" == *'?'* ]] && sep='&'
          export MIGRATOR_DATABASE_URL="${MIGRATOR_DATABASE_URL}${sep}options=-c%20lock_timeout%3D5000"
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          npm run security:sync-runtime-credential

      - name: Verify least-privilege runtime credential
        if: inputs.operation == 'migrate' || inputs.operation == 'sync-runtime-credential'
        env:
          DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
        run: npm run security:db-role
