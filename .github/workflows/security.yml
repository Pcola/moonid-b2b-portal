name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # týždenný sken (pondelok 06:00 UTC) — zachytí novo zverejnené pravidlá

# least-privilege — oba joby len čítajú kód
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # celá história — gitleaks skenuje aj staré commity
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet semgrep
      # high-signal bezpečnostné pravidlá (nie lint-štýl); --error spadne pri náleze
      - run: semgrep scan --config p/security-audit --error --metrics=off
