name: lighthouse

# Lab gate pre Core Web Vitals na verejných stránkach. Beží proti lokálnemu
# produkčnému buildu PR, takže nepotrebuje verejnú produkčnú URL ani DB secrets.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  lhci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonid_lighthouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moonid_lighthouse
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/moonid_lighthouse
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: lighthouse-placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Run Lighthouse CI
        run: |
          npm install --global @lhci/cli@0.15.1
          lhci autorun --config=./lighthouserc.json
