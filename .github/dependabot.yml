version: 2
updates:
  # npm závislosti — týždenné security/version PR
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # GitHub Actions verzie
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
